[project]
name = "sourcebound"
version = "0.1.0"
description = "Drafts a credit memo on a US public company from its SEC filings and traces every figure to source data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sourcebound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a real external service; run only on request with -m live",
]
addopts = "-m 'not live'"
