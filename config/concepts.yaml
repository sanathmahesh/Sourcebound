# Concept fallback chains (PLAN.md 4.5). Revised only with the author's approval.
# Revision 1, approved 17 November 2026 (decision log D18): total revenue first; finance-lease liabilities
# count as debt and finance-lease interest as interest; balance-sheet components first for total debt;
# Verizon's capex tag added.
# Revision 2, approved 17 November 2026 (decision log D19): net-interest tags (sign flipped) before the
# cash-paid proxy; amortisation optional beside depreciation; more short-term-debt tags, and short-term
# debt assumed zero when nothing is reported; Oracle's notes-payable debt; balance-sheet current portion
# as a year-1 maturity fallback.
# Revision 3, approved 17 November 2026 (D27): the finance-lease current portion is optional.
#
# Each concept:
#   label:     plain-English name
#   kind:      flow (measured over a period: income statement, cash flow) or
#              instant (measured on a date: balance sheet)
#   required:  true  -> no fact means "not available", and ratios using it are "not available"
#              false -> no fact means "assumed zero: not reported", logged and put on the checklist
#   chain:     candidates in rank order (rank 1 first). The first candidate the company reports wins.
#
# A candidate is either
#   - tag: <us-gaap tag>                       one reported fact, or
#   - sum: [<component>, ...]                  the sum of several components.
# A component is `tag: <us-gaap tag>` or `concept: <another concept>` (resolved through that concept's
# own chain). A component marked `optional: true` counts as zero when not reported, and is logged.
# A component marked `negate: true` uses minus the reported value (for tags reported as negative numbers).
# A candidate resolves only if every non-optional component is reported for the period.
# `flag` is a note shown beside every value resolved through that candidate.

revenue:
  label: Revenue
  kind: flow
  required: true
  chain:
    # Revenues is total revenue; the contract-revenue tag can leave out other income such as membership
    # fees (Walmart: 713,163 against 706,413 for FY2026).
    - tag: Revenues
    - tag: RevenueFromContractWithCustomerExcludingAssessedTax
    - tag: RevenueFromContractWithCustomerIncludingAssessedTax
    - tag: SalesRevenueNet

operating_income:
  label: Operating income
  kind: flow
  required: true
  chain:
    - tag: OperatingIncomeLoss
    # "Pre-tax income from continuing operations" has two common us-gaap tags; both are tried.
    - sum:
        - tag: IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest
        - concept: interest_expense
      flag: "derived: pre-tax income from continuing operations plus interest expense"
    - sum:
        - tag: IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments
        - concept: interest_expense
      flag: "derived: pre-tax income from continuing operations plus interest expense"

d_and_a:
  label: Depreciation and amortisation
  kind: flow
  required: true
  chain:
    - tag: DepreciationDepletionAndAmortization
    - tag: DepreciationAndAmortization
    - tag: DepreciationAmortizationAndAccretionNet
    # Some companies (e.g. Union Pacific) report depreciation with no separate amortisation line.
    - sum:
        - tag: Depreciation
        - tag: AmortizationOfIntangibleAssets
          optional: true

interest_expense:
  label: Interest expense
  kind: flow
  required: true
  chain:
    - tag: InterestExpense
    - tag: InterestExpenseNonoperating
    # InterestExpense and InterestExpenseNonoperating are total interest expense, which normally includes
    # finance-lease interest. InterestExpenseDebt covers debt only, so lease interest is added to match
    # the debt definition (finance leases count as debt).
    - sum:
        - tag: InterestExpenseDebt
        - tag: FinanceLeaseInterestExpense
          optional: true
    - tag: InterestAndDebtExpense
    # Net interest (expense minus interest income), reported as a negative number when it is an expense.
    - tag: InterestIncomeExpenseNonoperatingNet
      negate: true
      flag: "net interest: interest expense net of interest income"
    - tag: InterestIncomeExpenseNet
      negate: true
      flag: "net interest: interest expense net of interest income"
    - tag: InterestPaidNet
      flag: "proxy: cash interest paid, not interest expense"

short_term_debt:
  label: Short-term debt (short-term borrowings plus current portion of long-term debt)
  kind: instant
  # Not required (approved, D19): companies usually omit the tag when nothing is due within a year, so
  # "nothing reported" counts as zero, is logged, and goes on the reviewer checklist.
  required: false
  chain:
    - tag: DebtCurrent
    - sum:
        - tag: LongTermDebtCurrent
        - tag: ShortTermBorrowings
          optional: true
        - tag: CommercialPaper
          optional: true
    - sum:
        - tag: LongTermDebtAndCapitalLeaseObligationsCurrent
        - tag: ShortTermBorrowings
          optional: true
        - tag: CommercialPaper
          optional: true
    - tag: NotesPayableCurrent

short_term_borrowings:
  label: Short-term borrowings (including commercial paper)
  kind: instant
  required: false
  # Used only to reconcile the maturity ladder with total debt.
  chain:
    - tag: ShortTermBorrowings
    - tag: CommercialPaper

total_debt:
  label: Total debt (borrowings plus finance-lease liabilities)
  kind: instant
  required: true
  chain:
    # Debt-only balance-sheet lines, with finance leases added from their own lines.
    - sum:
        - tag: LongTermDebtNoncurrent
        - concept: short_term_debt
        - concept: finance_lease_liabilities
    # Lines that already combine debt and finance leases.
    - sum:
        - tag: LongTermDebtAndCapitalLeaseObligations
        - concept: short_term_debt
    - sum:
        - tag: LongTermDebtAndCapitalLeaseObligations
        - tag: LongTermDebtAndCapitalLeaseObligationsCurrent
        - tag: ShortTermBorrowings
          optional: true
    - sum:
        - tag: LongTermDebt
        - tag: ShortTermBorrowings
          optional: true
        - concept: finance_lease_liabilities
    # Notes payable presented as their own lines (Oracle).
    - sum:
        - tag: LongTermNotesAndLoans
        - concept: short_term_debt
        - concept: finance_lease_liabilities
    # Last: its scope varies by company (for Walmart it is long-term debt only).
    - tag: DebtLongtermAndShorttermCombinedAmount
      flag: "scope varies by company: may leave out short-term borrowings or finance leases"

finance_lease_liabilities:
  label: Finance-lease liabilities (current plus non-current)
  kind: instant
  required: false
  chain:
    # The current portion is optional (approved, D27): Caesars tags only the non-current part.
    - sum:
        - tag: FinanceLeaseLiabilityCurrent
          optional: true
        - tag: FinanceLeaseLiabilityNoncurrent
    - tag: FinanceLeaseLiability

cash:
  label: Cash and cash equivalents
  kind: instant
  required: true
  chain:
    - tag: CashAndCashEquivalentsAtCarryingValue
    - tag: CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents
      flag: "includes restricted cash"

short_term_investments:
  label: Short-term investments
  kind: instant
  required: false
  # The plan lists three tags joined by "or". They can overlap (available-for-sale debt securities are
  # usually part of short-term investments), so they are a chain: the first one reported is used.
  chain:
    - tag: ShortTermInvestments
    - tag: MarketableSecuritiesCurrent
    - tag: AvailableForSaleSecuritiesDebtSecuritiesCurrent

cfo:
  label: Cash from operations
  kind: flow
  required: true
  chain:
    - tag: NetCashProvidedByUsedInOperatingActivities
    - tag: NetCashProvidedByUsedInOperatingActivitiesContinuingOperations

capex:
  label: Capital expenditure
  kind: flow
  required: true
  chain:
    - tag: PaymentsToAcquirePropertyPlantAndEquipment
    - tag: PaymentsToAcquireProductiveAssets
    - tag: PaymentsForCapitalImprovements
    # Verizon reports "capital expenditures (including capitalized software)" under this tag.
    - tag: PaymentsToAcquireOtherProductiveAssets

# ----- Used from phase 2 (listed now so the tag-discovery report covers them) ------------------------

dividends:
  label: Dividends paid
  kind: flow
  required: false
  chain:
    - tag: PaymentsOfDividends
    - tag: PaymentsOfDividendsCommonStock
    - tag: PaymentsOfOrdinaryDividends

undrawn_revolver:
  label: Undrawn revolving credit capacity
  kind: instant
  required: false
  chain:
    - tag: LineOfCreditFacilityRemainingBorrowingCapacity

maturity_year_1:
  label: Debt maturing in the next twelve months
  kind: instant
  required: true
  chain:
    - tag: LongTermDebtMaturitiesRepaymentsOfPrincipalInNextTwelveMonths
    - tag: LongTermDebtCurrent
      flag: "balance-sheet current portion of long-term debt (the maturity table's year-1 figure is not tagged)"

maturity_year_2:
  label: Debt maturing in year two
  kind: instant
  required: true
  chain:
    - tag: LongTermDebtMaturitiesRepaymentsOfPrincipalInYearTwo

maturity_year_3:
  label: Debt maturing in year three
  kind: instant
  required: true
  chain:
    - tag: LongTermDebtMaturitiesRepaymentsOfPrincipalInYearThree

maturity_year_4:
  label: Debt maturing in year four
  kind: instant
  required: true
  chain:
    - tag: LongTermDebtMaturitiesRepaymentsOfPrincipalInYearFour

maturity_year_5:
  label: Debt maturing in year five
  kind: instant
  required: true
  chain:
    - tag: LongTermDebtMaturitiesRepaymentsOfPrincipalInYearFive

maturity_after_year_5:
  label: Debt maturing after year five
  kind: instant
  required: true
  chain:
    - tag: LongTermDebtMaturitiesRepaymentsOfPrincipalAfterYearFive
