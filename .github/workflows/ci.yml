# Runs the test suites on every push and pull request. No secrets, no network (live tests are skipped).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check:types
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: No secrets in the built site (a value given to a secret's name, or a key- or token-shaped string)
        run: |
          ! grep -rIlE '(SAIL_API_KEY|EDGAR_USER_AGENT).?[[:space:]]*[=:][[:space:]]*[^[:space:]].{7,}|Bearer [A-Za-z0-9._-]{20,}|sk-[A-Za-z0-9_-]{20,}' dist
