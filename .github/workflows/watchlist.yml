# Daily watchlist refresh (PLAN.md 4.10): new 10-K/10-Q -> refreshed ratios, scorecard and flags; memo marked
# stale. No model call and no Sail key here. Commits only when files changed (plus a weekly heartbeat), then
# deploys the new data to Vercel with the CLI.
#
# Runs daily (enabled by the author, 18 November 2026, PLAN.md phase 10) and can be run by hand from the
# Actions tab. Secrets: EDGAR_USER_AGENT, and VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID for the deploy.
name: watchlist
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Vercel even if no data changed"
        type: boolean
        default: false
  schedule:
    - cron: "17 11 * * *"   # daily at 11:17 UTC
permissions:
  contents: write
concurrency:
  group: watchlist
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Check EDGAR for new filings
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: uv run python -m sourcebound.watchlist.run
      - name: Commit changes, if any
        run: |
          if [ -n "$(git status --porcelain data/published)" ]; then
            git config user.name "sourcebound-watchlist"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/published
            git commit -m "Watchlist refresh $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes."
          fi
        id: commit
      # The Vercel project is not linked to this repository (D61), so the CLI deploys with a token. It deploys a
      # copy without .git, so no commit author is attached for Vercel's Hobby check on who authored a commit.
      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TELEMETRY_DISABLED: "1"
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "no VERCEL_TOKEN secret: not deployed"; exit 0; fi
          rsync -a --exclude .git ./ "$RUNNER_TEMP/site/"
          cd "$RUNNER_TEMP/site"
          npx -y vercel@65.11.0 deploy --prod --yes --token "$VERCEL_TOKEN" > /dev/null
          echo "deployed to production"
